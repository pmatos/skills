name: Test

on:
  pull_request:
    paths:
      - "review-offline/**"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "review-offline/**"
      - ".github/workflows/test.yml"

# Least privilege: the tests only read the checked-out tree.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The 4 smoke tests shell out to the real CLIs; they stay opt-in.
      REVIEW_OFFLINE_SMOKE: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Test
        run: uv run --with pytest pytest review-offline/tests
